<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radio Play</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#090909;
      color:white;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      width:600px;
      height:600px;
      background:#ff003c30;
      filter:blur(150px);
      top:-200px;
      right:-200px;
      z-index:-1;
    }

    .hero{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      position:relative;
    }

    .card{
      width:100%;
      max-width:450px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:30px;
      padding:40px 30px;
      box-shadow:0 0 40px rgba(255,0,60,0.2);
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:20px;
      border:4px solid #ff003c;
      box-shadow:0 0 30px #ff003c80;
    }

    h1{
      font-size:42px;
      font-weight:700;
      margin-bottom:10px;
    }

    .subtitle{
      color:#bbb;
      margin-bottom:30px;
      font-size:15px;
    }

    .live{
      display:inline-block;
      background:#ff003c;
      padding:8px 18px;
      border-radius:50px;
      font-size:14px;
      font-weight:600;
      margin-bottom:25px;
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{
        box-shadow:0 0 0 0 rgba(255,0,60,0.7);
      }
      70%{
        box-shadow:0 0 0 15px rgba(255,0,60,0);
      }
      100%{
        box-shadow:0 0 0 0 rgba(255,0,60,0);
      }
    }

    .player{
      margin-top:20px;
    }

    audio{
      width:100%;
      border-radius:15px;
    }

    .equalizer{
      display:flex;
      justify-content:center;
      align-items:flex-end;
      gap:5px;
      height:50px;
      margin:30px 0;
    }

    .bar{
      width:6px;
      background:#ff003c;
      border-radius:10px;
      animation:bounce 1s infinite ease-in-out;
    }

    .bar:nth-child(1){height:15px;animation-delay:0s;}
    .bar:nth-child(2){height:35px;animation-delay:0.2s;}
    .bar:nth-child(3){height:20px;animation-delay:0.4s;}
    .bar:nth-child(4){height:45px;animation-delay:0.6s;}
    .bar:nth-child(5){height:25px;animation-delay:0.8s;}

    @keyframes bounce{
      0%,100%{
        transform:scaleY(1);
      }
      50%{
        transform:scaleY(1.8);
      }
    }

    .socials{
      margin-top:30px;
      display:flex;
      justify-content:center;
      gap:15px;
    }

    .socials a{
      width:45px;
      height:45px;
      border-radius:50%;
      background:rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      color:white;
      font-size:18px;
      transition:0.3s;
    }

    .socials a:hover{
      background:#ff003c;
      transform:translateY(-4px);
    }

    footer{
      text-align:center;
      padding:25px;
      color:#777;
      font-size:14px;
    }

    @media(max-width:500px){
      h1{
        font-size:32px;
      }

      .card{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

<section class="hero">

  <div class="card">

    <img 
      src="https://cdn-icons-png.flaticon.com/512/727/727245.png" 
      alt="Radio Logo"
      class="logo"
    >

    <div class="live">● CANLI YAYIN</div>

    <h1>RADIO PLAY</h1>

    <p class="subtitle">
      Müziğin Ritmini Canlı Yaşa
    </p>

    <div class="equalizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="player">
      <audio controls autoplay>
        <source src="https://sslyayin.netyayin.net/2828/stream" type="audio/mpeg">
        Tarayıcınız audio elementini desteklemiyor.
      </audio>
    </div>

    <div class="socials">
      <a href="#">F</a>
      <a href="#">I</a>
      <a href="#">Y</a>
      <a href="#">T</a>
    </div>

  </div>

</section>

<footer>
  © 2026 Radio Play - Tüm Hakları Saklıdır
</footer>

</body>
</html>
